[OpenRouter]
APIKey=
Model=deepseek/deepseek-chat

[SMTP2GO]
APIKey=
SenderName=Alex Morgan
SenderEmail=alex@myagency.com
DefaultSubject=Quick question regarding {company_name}
DelaySeconds=5

[Prompt]
EmailLanguage=English
MyService=Modern web redesign & high-converting lead funnels
SystemPrompt=You are a world-class B2B sales copywriter specializing in natural, highly personalized, and direct cold outreach. Never sound robotic or generic.
UserPrompt=Write a short, conversational cold outreach email (under 90 words) to {company_name} located in {city}. My name is {my_name} and we help local businesses with {my_service}. Sign-off with my name.
